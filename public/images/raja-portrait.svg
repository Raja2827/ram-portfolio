<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title description">
  <title id="title">Portrait photograph placeholder</title>
  <desc id="description">A clearly labeled placeholder for Raja Asutosh Mishra's portrait photograph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1a20"/>
      <stop offset="1" stop-color="#0b0c11"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#f4f3f4" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="900" height="1100" fill="url(#background)"/>
  <rect width="900" height="1100" fill="url(#grid)"/>
  <rect x="34" y="34" width="832" height="1032" fill="none" stroke="#ff655b" stroke-opacity=".45"/>
  <path d="M68 142h110M68 142v110M832 958H722m110 0V848" fill="none" stroke="#ff655b" stroke-width="2"/>
  <text x="450" y="500" fill="#ff766b" font-family="Arial, sans-serif" font-size="24" letter-spacing="7" text-anchor="middle">PORTRAIT PHOTOGRAPH</text>
  <text x="450" y="552" fill="#f3f3f5" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2" text-anchor="middle">PLACEHOLDER</text>
  <text x="450" y="604" fill="#a5a7b0" font-family="Arial, sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">RAJA ASUTOSH MISHRA</text>
</svg>
